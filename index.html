<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A World Warming Unevenly</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;color:#253d32;background:#faf7ef;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}a{color:inherit;text-underline-offset:3px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #236b99;outline-offset:3px}.shell{padding:13px 24px 0;border-bottom:1px solid #b9c8b1;background:#faf7ef}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:700 25px/1.2 Georgia,serif;text-decoration:none}.project-label{font-size:11px;color:#60715e}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:14px 0 10px}.tabs button{border:1px solid #bdcbb4;border-radius:8px;background:#fffdf7;color:#3a5140;padding:9px 12px;text-align:left;min-height:48px}.tabs button strong{font-size:15px}.tabs button span{font-size:11px;display:block;margin-top:2px;color:#64765e}.tabs button[aria-selected=true]{background:#294f39;color:white;border-color:#294f39}.tabs button[aria-selected=true] span{color:#e1ecda}.utility{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:0 0 9px}.utility p{margin:0;font-size:12px;color:#586f59}.open{font-size:11px;white-space:nowrap}.subnav{display:flex;gap:5px;align-items:center}.subnav[hidden]{display:none}.subnav button{font-size:11px;border:1px solid #b4c4aa;border-radius:5px;padding:4px 9px;color:#36503c;background:#fffdf7}.subnav button[aria-pressed=true]{background:#e2ecd7;border-color:#789367;font-weight:700}main{min-height:0;position:relative;background:white}iframe{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;left:15px;top:12px;z-index:2;background:#fffdf5;border:1px solid #c4cdbd;padding:7px 12px;border-radius:6px;font-size:12px}.loading[hidden]{display:none}.skip{position:absolute;left:15px;top:-100px;z-index:10;background:white;padding:8px}.skip:focus{top:12px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){.shell{padding:12px 12px 0}.brand{font-size:20px}.project-label{font-size:10px;max-width:80px;text-align:right}.tabs{gap:5px;margin-top:12px}.tabs button{padding:8px 6px;text-align:center}.tabs button span{display:none}.tabs button strong{font-size:14px}.utility p{font-size:11px}.open{font-size:10px}}</style></head><body><a class="skip" href="#part-panel">Skip to current part</a><header class="shell"><div class="brand-row"><a class="brand" href="#part1">A World Warming Unevenly</a><span class="project-label">DSC 106 · Team 404</span></div><nav class="tabs" role="tablist" aria-label="Project parts"><button id="tab-part1" type="button" role="tab" aria-controls="part-panel" aria-selected="true" tabindex="0" data-part="part1"><strong>Part 1</strong><span>Who emits?</span></button><button id="tab-part2" type="button" role="tab" aria-controls="part-panel" aria-selected="false" tabindex="-1" data-part="part2"><strong>Part 2</strong><span>One atmosphere</span></button><button id="tab-part3" type="button" role="tab" aria-controls="part-panel" aria-selected="false" tabindex="-1" data-part="part3"><strong>Part 3</strong><span>Local stories</span></button><button id="tab-part4" type="button" role="tab" aria-controls="part-panel" aria-selected="false" tabindex="-1" data-part="part4"><strong>Part 4</strong><span>Our choices</span></button></nav><div class="utility"><p id="part-description">CO₂ emissions inequality</p><div id="china-nav" class="subnav" aria-label="Part 3 views" hidden><button id="show-world" type="button" aria-pressed="true">World map</button><button id="show-china" type="button" aria-pressed="false">China · Yangtze</button></div><a id="open-part" class="open" href="./part1/index.html" target="_blank" rel="noopener">Open current part in a new window ↗</a></div></header><main id="part-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-part1"><span id="loading" class="loading" role="status">Loading chapter…</span><iframe id="part-frame" title="Part 1" allowfullscreen></iframe></main><noscript><p>Open a part: <a href="./part1/index.html">Part 1</a> · <a href="./part2/index.html">Part 2</a> · <a href="./part3/index.html">Part 3</a> · <a href="./part4/index.html">Part 4</a>.</p></noscript><script>(()=>{
const parts=[{"id": "part1", "label": "Part 1", "name": "Who emits?", "description": "CO\u2082 emissions inequality", "src": "./part1/index.html"}, {"id": "part2", "label": "Part 2", "name": "One atmosphere", "description": "Industry, emissions and shared warming", "src": "./part2/index.html"}, {"id": "part3", "label": "Part 3", "name": "Local stories", "description": "Explore regional processes and changes", "src": "./part3/index.html"}, {"id": "part4", "label": "Part 4", "name": "Our choices", "description": "Not added yet", "src": "./part4/index.html"}],byId=new Map(parts.map(p=>[p.id,p])),frame=document.getElementById('part-frame'),tabs=[...document.querySelectorAll('[role=tab]')],base=new URL('.',location.href);let current='part1',currentChina=false;
// Patch only live link targets. No team member's HTML or scripts are rewritten.
const observedFrames=new WeakSet(),observedDocs=new WeakSet();
function connectWindow(win){try{const doc=win.document;if(!doc||observedDocs.has(doc))return;observedDocs.add(doc);doc.addEventListener('click',event=>{const a=event.target.closest?.('a[href]');if(!a||event.defaultPrevented||event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||a.hasAttribute('download'))return;const u=new URL(a.getAttribute('href'),doc.baseURI);if(u.origin===base.origin&&(u.pathname===base.pathname||u.pathname===base.pathname+'index.html')){event.preventDefault();window.location.hash=u.hash||'#'+current;render();}});for(const child of doc.querySelectorAll('iframe')){if(!observedFrames.has(child)){observedFrames.add(child);child.addEventListener('load',()=>connectWindow(child.contentWindow));}if(child.contentDocument?.readyState==='complete')connectWindow(child.contentWindow);}}catch{}}
function route(){const value=location.hash.slice(1).split('/');return {id:byId.has(value[0])?value[0]:'part1',china:value[0]==='part3'&&value[1]==='china'};}
function render(){const r=route(),part=byId.get(r.id),src=r.china?'./part3/china/index.html':part.src,url=new URL(src,base).href;current=r.id;currentChina=r.china;for(const tab of tabs){const active=tab.dataset.part===current;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;}document.getElementById('part-panel').setAttribute('aria-labelledby','tab-'+current);document.getElementById('part-description').textContent=r.china?'China · Yangtze chapters':part.description;document.getElementById('china-nav').hidden=current!=='part3';document.getElementById('show-world').setAttribute('aria-pressed',String(!r.china));document.getElementById('show-china').setAttribute('aria-pressed',String(r.china));document.getElementById('open-part').href=url;frame.title=r.china?'Part 3 · China · Yangtze':part.label+' · '+part.description;document.title=part.label+' · A World Warming Unevenly';if(frame.getAttribute('src')!==url){document.getElementById('loading').hidden=false;frame.src=url;}}
function select(id,china=false){const hash='#'+id+(china?'/china':'');if(location.hash===hash)render();else location.hash=hash;}
for(const tab of tabs){tab.addEventListener('click',()=>select(tab.dataset.part));tab.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const i=tabs.indexOf(tab),n=event.key==='Home'?0:event.key==='End'?3:(i+(event.key==='ArrowRight'?1:3))%4;tabs[n].focus();select(tabs[n].dataset.part);});}
document.getElementById('show-world').addEventListener('click',()=>select('part3'));document.getElementById('show-china').addEventListener('click',()=>select('part3',true));
frame.addEventListener('load',()=>{document.getElementById('loading').hidden=true;connectWindow(frame.contentWindow);});window.addEventListener('hashchange',render);render();
})();</script></body></html>
